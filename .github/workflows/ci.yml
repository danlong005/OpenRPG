name: CI

# Builds rpgc and dspfc from source and runs both test suites on every push,
# on all three supported platforms — independent of the release process, so
# regressions are caught immediately instead of at release time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison g++ unixodbc-dev unixodbc libsqliteodbc

      - name: Build
        run: make

      - name: Build OpenDSPF
        run: make -C OpenDSPF

      - name: Run OpenRPG test suite
        env:
          ODBC_FLAGS: -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

  # ── Linux ARM64 ──────────────────────────────────────────────────────────
  test-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison g++ unixodbc-dev unixodbc libsqliteodbc

      - name: Build
        run: make

      - name: Build OpenDSPF
        run: make -C OpenDSPF

      - name: Run OpenRPG test suite
        env:
          ODBC_FLAGS: -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

  # ── Windows ARM64 ────────────────────────────────────────────────────────
  # No upstream ARM64 build of the SQLite ODBC driver exists, so SQL/RLA
  # tests are skipped here rather than failed — everything else runs.
  test-windows-arm64:
    runs-on: windows-11-arm

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            flex
            bison
            make
            diffutils

      - name: Build
        run: make && make -C OpenDSPF

      - name: Run OpenRPG test suite
        env:
          SKIP_SQL: "1"
          ODBC_FLAGS: -lodbc32
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

  # ── External DB smoke tests (Postgres, MySQL) ───────────────────────────────
  # Validates real ODBC connectivity beyond the SQLite path the platform
  # matrix above exercises. Service containers are Linux-only in GH Actions,
  # so this runs once rather than per-platform — the point is proving the
  # SQL/RLA code path against real servers, not re-testing platform coverage.
  test-external-db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rpgtest
          POSTGRES_PASSWORD: rpgtest
          POSTGRES_DB: rpgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rpgtest
          MYSQL_DATABASE: rpgtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison g++ unixodbc-dev unixodbc odbc-postgresql odbc-mariadb

      - name: Show registered ODBC drivers
        run: odbcinst -q -d

      - name: Build
        run: make

      - name: Run Postgres smoke test
        env:
          ODBC_FLAGS: -lodbc
        run: |
          ./tests/run_external_db_tests.sh \
            "Driver={PostgreSQL Unicode};Server=localhost;Port=5432;Database=rpgtest;Uid=rpgtest;Pwd=rpgtest;" \
            postgres

      - name: Run MySQL smoke test
        env:
          ODBC_FLAGS: -lodbc
        run: |
          ./tests/run_external_db_tests.sh \
            "Driver={MariaDB Unicode};Server=127.0.0.1;Port=3306;Database=rpgtest;Uid=root;Pwd=rpgtest;" \
            mysql

  # ── macOS ────────────────────────────────────────────────────────────────
  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install flex bison unixodbc sqliteodbc
          # Homebrew installs the sqliteodbc library but does NOT register it with
          # unixODBC. Register it manually so Driver={SQLite3} works at runtime.
          DRIVER=$(brew --prefix)/lib/libsqlite3odbc.dylib
          printf '[SQLite3]\nDescription=SQLite3 ODBC Driver\nDriver=%s\nSetup=%s\n' \
            "$DRIVER" "$DRIVER" \
            | ODBCSYSINI=/opt/homebrew/etc odbcinst -i -d -f /dev/stdin

      - name: Build
        run: make

      - name: Build OpenDSPF
        run: make -C OpenDSPF

      - name: Run OpenRPG test suite
        env:
          ODBCSYSINI: /opt/homebrew/etc
          ODBC_FLAGS: -I/opt/homebrew/include -L/opt/homebrew/lib -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

  # ── Windows ──────────────────────────────────────────────────────────────
  test-windows:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            flex
            bison
            make
            diffutils

      - name: Install SQLite ODBC driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.ch-werner.de/sqliteodbc/sqliteodbc_w64.exe" -OutFile "$env:TEMP\sqliteodbc_w64.exe" -SkipCertificateCheck
          Start-Process -Wait -FilePath "$env:TEMP\sqliteodbc_w64.exe" -ArgumentList "/S"
          # The installer registers as "SQLite3 ODBC Driver"; add alias "SQLite3" so
          # connection strings using Driver={SQLite3} work
          $driverKey = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3 ODBC Driver"
          $dllPath   = (Get-ItemProperty -Path $driverKey -Name Driver).Driver
          New-Item -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Driver -Value $dllPath -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Setup  -Value $dllPath -PropertyType String -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers" -Name SQLite3 -Value Installed

      - name: Build
        run: make && make -C OpenDSPF

      - name: Run OpenRPG test suite
        env:
          CXX: g++
          ODBC_FLAGS: -lodbc32
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test
