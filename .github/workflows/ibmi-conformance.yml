name: IBM i conformance

# Verifies the test corpus against a REAL IBM i (PUB400) using IBM's own ILE
# RPG compiler, and compares its verdict with rpgc's. This is the only check
# that can catch source rpgc accepts but real RPG rejects: tests/expected_output
# is regenerated from rpgc's own output, so the local suite can only ever verify
# what rpgc already does.
#
# Two jobs, deliberately split:
#
#   offline  — runs on every push and pull request, needs no network and no
#              secrets (so it works from forks). Fails if any source has
#              changed since it was last verified on IBM i, i.e. if someone
#              edits a test without re-verifying it.
#
#   verify   — on demand only (Actions → IBM i conformance → Run workflow,
#              or `gh workflow run ibmi-conformance.yml -f mode=full`).
#              `changed` sends only the sources whose hash moved; `full`
#              sends the whole corpus; `smoke` compiles one file. A run then
#              refreshes the baseline and commits it back to the branch it
#              ran on. Fails on a REGRESSION: a source IBM
#              accepted before and rejects now. The absolute accepted count is
#              deliberately not a gate; it conflates unrelated causes (missing
#              IBM i objects, deliberate negative tests, real findings) — see
#              TODO.md's bucket triage.
#
# Load discipline: PUB400 is a free community machine run on donated hardware.
# There is no schedule (removed 2026-09-23): a weekly run only uploaded its
# refreshed baseline as an artifact and never committed it, so it re-sent the
# same files every Monday without the result ever landing. The run is serial
# and it sends only changed files. Do not make this a per-PR gate.
#
# Every run that contacts the machine first CLEARS the whole library (CLRLIB)
# and rebuilds the objects the corpus needs (scripts/ibmi-setup-objects.sh).
# The library is shared with other projects that do the same: each one owns it
# for the length of its run. A 'changed' run with nothing changed touches
# nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'changed = verify sources whose hash moved; full = compile the whole corpus; smoke = compile one file to prove the connection; execute = run the run tests on IBM i and compare their output'
        type: choice
        options: [changed, full, smoke, execute]
        default: changed

permissions:
  contents: read

jobs:
  # ── offline: no network, no secrets, runs everywhere ─────────────────────
  offline:
    name: baseline check (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Every source matches a verified IBM i verdict
        run: python3 scripts/conformance-baseline.py check

  # ── verify: talks to the real machine ────────────────────────────────────
  verify:
    name: verify on IBM i
    # Never on pull_request: fork PRs cannot see the SSH secret, and a shared
    # free machine should not be reachable from untrusted branch contents.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'execute'
    runs-on: ubuntu-latest
    # Write access for the wiki push only (the results page, below); every
    # other job keeps the read-only default above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure SSH for PUB400
        env:
          KEY: ${{ secrets.PUB400_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret PUB400_SSH_KEY is not set — see TODO.md" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # pin the host key rather than trusting on first use
          ssh-keyscan -p 2222 -H pub400.com >> ~/.ssh/known_hosts 2>/dev/null

      # A 'changed' run with nothing changed never contacts the machine at
      # all, which is efficient but leaves the SSH path unproven. 'smoke'
      # compiles a single file so the connection itself is exercised, and
      # leaves the baseline untouched.
      - name: Compile on IBM i
        id: compile
        env:
          PUB400_USER: ${{ secrets.PUB400_USER }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            smoke) scripts/ibmi-conformance.sh --limit 1 --no-baseline ;;
            # Every source, whether or not it changed: the only mode that
            # notices the environment drifting under unchanged tests (PUB400
            # deleting the test files, say) rather than the tests changing.
            full)  scripts/ibmi-conformance.sh ;;
            *)     scripts/ibmi-conformance.sh --changed-only ;;
          esac

      - name: Publish the run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibmi-conformance
          path: |
            ibmi-conformance-report.txt
            ibmi-conformance-transcript.txt
            ibmi-conformance-baseline.json
          if-no-files-found: ignore

      - name: Show the baseline diff
        if: always()
        run: git --no-pager diff --stat -- ibmi-conformance-baseline.json || true

      # The wiki's IBM-i-Conformance-Results page: which programs IBM
      # compiled, which it did not, and IBM's reason for each. Rendered from
      # the baseline this run refreshed, so it is complete even when only
      # changed sources were sent. Published even when the compile step
      # failed on a regression — that is when the page matters most. Every
      # run, smoke included, rebuilds rpgc and records its verdicts, so the
      # page's compatibility rating is recomputed on every run.
      # The page's "Compiles with rpgc" column: rpgc's own verdict on every
      # program, recorded fresh from this commit rather than taken from
      # whatever was last committed to the baseline.
      - name: Build rpgc
        if: >-
          always() &&
          steps.compile.outcome != 'skipped' && steps.compile.outcome != 'cancelled'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison g++ unixodbc-dev libncurses-dev
          make
          python3 scripts/conformance-baseline.py rpgc
          # The README's compatibility rating, from the verdicts just recorded
          python3 scripts/conformance-wiki.py --out /tmp/page.md \
            --readme README.md --repo "${{ github.repository }}"

      # The run's results land in the repository, not only in an artifact: a
      # changed run then sends each edited source once, and the offline check
      # stays green. Not on a regression — committing that baseline would make
      # the regression the new normal, and the next run would stop reporting
      # it; the page below still shows it. The report and the differences
      # listing are built from the run's transcript, which covers every source
      # only in a full run, so they are committed from full runs alone.
      # A push with the workflow's own token starts no further workflow runs.
      - name: Commit the refreshed baseline
        # A smoke run leaves IBM's verdicts alone (--no-baseline), so what it
        # commits is rpgc's refreshed verdicts only.
        if: steps.compile.outcome == 'success'
        run: |
          files="ibmi-conformance-baseline.json README.md"
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            python3 scripts/conformance-diff.py
            files="$files ibmi-conformance-report.txt ibmi-conformance-differences.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then
            echo "baseline unchanged"
            exit 0
          fi
          git commit -q -m "IBM i conformance baseline, ${{ github.event.inputs.mode || 'changed' }} run ${{ github.run_id }}"
          # main may have moved while PUB400 was compiling
          for attempt in 1 2 3; do
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::could not push the refreshed baseline; it is in the run's artifact"

      # A regression run commits no baseline (above), but the README's
      # rating is refreshed on every run: commit it alone.
      - name: Commit the README rating
        if: always() && steps.compile.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "rating unchanged"
            exit 0
          fi
          git commit -q -m "README: IBM i compatibility rating, run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::could not push the README rating"

      - name: Publish the results page to the wiki
        if: >-
          always() &&
          steps.compile.outcome != 'skipped' && steps.compile.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          python3 scripts/conformance-wiki.py \
            --out wiki/IBM-i-Conformance-Results.md \
            --sidebar wiki/_Sidebar.md \
            --mode "${{ github.event.inputs.mode || 'changed' }}" \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}"
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IBM-i-Conformance-Results.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "results page unchanged"
          else
            git commit -q -m "IBM i conformance results, run ${{ github.run_id }}"
            git push -q
          fi

  # ── execute: runs the programs on the real machine ───────────────────────
  # scripts/ibmi-execution.sh compiles each standalone run test on IBM i, runs
  # it, and compares what it displayed with tests/expected_output/ (which rpgc
  # generated). Commits ibmi-execution-baseline.json (IBM's output per source)
  # and ibmi-execution-differences.md. Differences are findings, not failures:
  # the job fails only when the run itself does.
  execute:
    name: run on IBM i
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'execute'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure SSH for PUB400
        env:
          KEY: ${{ secrets.PUB400_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret PUB400_SSH_KEY is not set — see TODO.md" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 -H pub400.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run on IBM i
        env:
          PUB400_USER: ${{ secrets.PUB400_USER }}
        run: scripts/ibmi-execution.sh

      - name: Publish the run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibmi-execution
          path: |
            ibmi-execution-transcript.txt
            ibmi-execution-baseline.json
            ibmi-execution-differences.md
          if-no-files-found: ignore

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibmi-execution-baseline.json ibmi-execution-differences.md
          if git diff --cached --quiet; then
            echo "results unchanged"
            exit 0
          fi
          git commit -q -m "IBM i execution results, run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::could not push the results; they are in the run's artifact"
