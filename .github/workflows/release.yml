name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Linux: build .deb and .rpm ──────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison g++ \
            unixodbc-dev unixodbc libsqliteodbc \
            ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build
        run: make PREFIX=/usr

      - name: Build OpenDSPF
        run: make -C OpenDSPF VERSION=${GITHUB_REF_NAME#v}

      - name: Run OpenRPG test suite
        env:
          ODBC_FLAGS: -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

      - name: Stage install
        run: sudo make install PREFIX=/usr DESTDIR=/tmp/rpgc-root

      - name: Stage OpenDSPF install
        run: sudo make -C OpenDSPF install PREFIX=/usr DESTDIR=/tmp/dspfc-root

      - name: Package .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t deb \
              -n rpgc -v "$VERSION" \
              --description "RPG IV compiler — run RPG programs on Linux without IBM i" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              --depends unixodbc \
              --depends unixodbc-dev \
              --depends g++ \
              --deb-recommends dspfc \
              -C /tmp/rpgc-root \
              usr/

      - name: Package .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t rpm \
              -n rpgc -v "$VERSION" \
              --description "RPG IV compiler — run RPG programs on Linux without IBM i" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              --depends unixODBC \
              --depends unixODBC-devel \
              --depends gcc-c++ \
              -C /tmp/rpgc-root \
              usr/

      - name: Package dspfc .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t deb \
              -n dspfc -v "$VERSION" \
              --description "Display file compiler for OpenRPG interactive screen programs" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              -C /tmp/dspfc-root \
              usr/

      - name: Package dspfc .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t rpm \
              -n dspfc -v "$VERSION" \
              --description "Display file compiler for OpenRPG interactive screen programs" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              -C /tmp/dspfc-root \
              usr/

      - name: Upload packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rpgc_*.deb
            rpgc-*.rpm
            dspfc_*.deb
            dspfc-*.rpm

  # ── Linux ARM64: build .deb and .rpm ────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison g++ \
            unixodbc-dev unixodbc libsqliteodbc \
            ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build
        run: make PREFIX=/usr

      - name: Build OpenDSPF
        run: make -C OpenDSPF VERSION=${GITHUB_REF_NAME#v}

      - name: Run OpenRPG test suite
        env:
          ODBC_FLAGS: -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

      - name: Stage install
        run: sudo make install PREFIX=/usr DESTDIR=/tmp/rpgc-root

      - name: Stage OpenDSPF install
        run: sudo make -C OpenDSPF install PREFIX=/usr DESTDIR=/tmp/dspfc-root

      # fpm auto-detects the runner's architecture (arm64/aarch64) and
      # includes it in the output filename, so these never collide with
      # the x86_64 packages from build-linux in the same release.
      - name: Package .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t deb \
              -n rpgc -v "$VERSION" \
              --description "RPG IV compiler — run RPG programs on Linux without IBM i" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              --depends unixodbc \
              --depends unixodbc-dev \
              --depends g++ \
              --deb-recommends dspfc \
              -C /tmp/rpgc-root \
              usr/

      - name: Package .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t rpm \
              -n rpgc -v "$VERSION" \
              --description "RPG IV compiler — run RPG programs on Linux without IBM i" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              --depends unixODBC \
              --depends unixODBC-devel \
              --depends gcc-c++ \
              -C /tmp/rpgc-root \
              usr/

      - name: Package dspfc .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t deb \
              -n dspfc -v "$VERSION" \
              --description "Display file compiler for OpenRPG interactive screen programs" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              -C /tmp/dspfc-root \
              usr/

      - name: Package dspfc .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t rpm \
              -n dspfc -v "$VERSION" \
              --description "Display file compiler for OpenRPG interactive screen programs" \
              --url "https://github.com/${{ github.repository }}" \
              --maintainer "${{ github.repository_owner }}" \
              --license MIT \
              -C /tmp/dspfc-root \
              usr/

      - name: Upload packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rpgc_*.deb
            rpgc-*.rpm
            dspfc_*.deb
            dspfc-*.rpm

  # ── macOS: build .dmg ───────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install flex bison unixodbc sqliteodbc
          # Homebrew installs the sqliteodbc library but does NOT register it with
          # unixODBC. Register it manually so Driver={SQLite3} works at runtime.
          DRIVER=$(brew --prefix)/lib/libsqlite3odbc.dylib
          printf '[SQLite3]\nDescription=SQLite3 ODBC Driver\nDriver=%s\nSetup=%s\n' \
            "$DRIVER" "$DRIVER" \
            | ODBCSYSINI=/opt/homebrew/etc odbcinst -i -d -f /dev/stdin

      - name: Build
        run: make

      - name: Build OpenDSPF
        run: make -C OpenDSPF VERSION=${GITHUB_REF_NAME#v}

      - name: Run OpenRPG test suite
        env:
          ODBCSYSINI: /opt/homebrew/etc
          ODBC_FLAGS: -I/opt/homebrew/include -L/opt/homebrew/lib -lodbc
        run: make test

      - name: Run OpenDSPF test suite
        run: make -C OpenDSPF test

      - name: Stage install
        run: sudo make install DESTDIR=/tmp/rpgc-root

      - name: Build .pkg installer
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # Pre-install script: check for Xcode Command Line Tools and unixodbc
          mkdir -p /tmp/rpgc-scripts
          cat > /tmp/rpgc-scripts/preinstall << 'EOF'
          #!/bin/bash
          # rpgc shells out to clang++ at runtime (it compiles the C++ it
          # generates), which needs the Xcode Command Line Tools. Unlike the
          # unixodbc check below, this can't be a hard-fail here: `xcode-select
          # --install` only *starts* an async GUI download the user has to
          # click through, it can't be waited on inside a package-install
          # script. So we just kick it off proactively and let the rest of the
          # install proceed — without this, the same prompt would otherwise
          # only appear later, as a confusing failed-compile error on the
          # user's first `rpgc` run.
          if ! xcode-select -p >/dev/null 2>&1; then
              echo "Xcode Command Line Tools not found — starting installation..."
              xcode-select --install >/dev/null 2>&1
              echo "Finish that install before running rpgc for the first time."
          fi

          if [ ! -f /opt/homebrew/lib/libodbc.dylib ] && [ ! -f /usr/local/lib/libodbc.dylib ]; then
              # Try to install it automatically via Homebrew (bootstrapping
              # Homebrew itself first if needed) before giving up. This
              # script runs as root (pkg install scripts always do), but
              # Homebrew refuses to run as root, so everything below runs as
              # the actual logged-in console user instead — the standard
              # pattern for pkg scripts that need to act as a real user.
              find_brew() {
                  if [ -x /opt/homebrew/bin/brew ]; then
                      echo /opt/homebrew/bin/brew
                  elif [ -x /usr/local/bin/brew ]; then
                      echo /usr/local/bin/brew
                  fi
              }

              CONSOLE_USER=$(stat -f%Su /dev/console 2>/dev/null)
              BREW_BIN=$(find_brew)

              if [ -z "$BREW_BIN" ] && [ -n "$CONSOLE_USER" ] && [ "$CONSOLE_USER" != "root" ]; then
                  echo "Homebrew not found — installing it first (this can take a few minutes)..."
                  sudo -u "$CONSOLE_USER" env NONINTERACTIVE=1 /bin/bash -c \
                      "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                  BREW_BIN=$(find_brew)
              fi

              if [ -n "$BREW_BIN" ] && [ -n "$CONSOLE_USER" ] && [ "$CONSOLE_USER" != "root" ]; then
                  echo "unixodbc not found — installing via Homebrew..."
                  sudo -u "$CONSOLE_USER" "$BREW_BIN" install unixodbc
              fi

              # Re-check: the steps above may not have run at all (no console
              # user, e.g. a headless install) or may have failed (no
              # internet, etc.) — this is the failure-mode-agnostic safety net.
              if [ ! -f /opt/homebrew/lib/libodbc.dylib ] && [ ! -f /usr/local/lib/libodbc.dylib ]; then
                  echo "Error: unixodbc is required and could not be installed automatically."
                  echo "Install Homebrew (https://brew.sh) then run: brew install unixodbc"
                  exit 1
              fi
          fi
          exit 0
          EOF
          chmod +x /tmp/rpgc-scripts/preinstall

          # Component 1: rpgc (required)
          pkgbuild \
            --root /tmp/rpgc-root \
            --identifier com.rpgc.compiler \
            --version "$VERSION" \
            --install-location / \
            --scripts /tmp/rpgc-scripts \
            /tmp/rpgc-component.pkg

          # Component 2: dspfc (optional)
          sudo make -C OpenDSPF install DESTDIR=/tmp/dspfc-root
          pkgbuild \
            --root /tmp/dspfc-root \
            --identifier com.rpgc.dspfc \
            --version "$VERSION" \
            --install-location / \
            /tmp/dspfc-component.pkg

          # Product archive: rpgc required, dspfc optional
          cat > /tmp/Distribution.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>OpenRPG $VERSION</title>
              <options customize="allow" require-scripts="false"/>
              <choices-outline>
                  <line choice="com.rpgc.compiler"/>
                  <line choice="com.rpgc.dspfc"/>
              </choices-outline>
              <choice id="com.rpgc.compiler" title="OpenRPG Compiler (rpgc)"
                      description="The RPG IV compiler. Required."
                      visible="true" enabled="false" selected="true">
                  <pkg-ref id="com.rpgc.compiler"/>
              </choice>
              <choice id="com.rpgc.dspfc" title="OpenDSPF Display File Compiler (dspfc)"
                      description="Compiles display file source into descriptors for interactive screen programs."
                      visible="true" enabled="true" selected="true">
                  <pkg-ref id="com.rpgc.dspfc"/>
              </choice>
              <pkg-ref id="com.rpgc.compiler" version="$VERSION">/tmp/rpgc-component.pkg</pkg-ref>
              <pkg-ref id="com.rpgc.dspfc" version="$VERSION">/tmp/dspfc-component.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          productbuild \
            --distribution /tmp/Distribution.xml \
            --package-path /tmp \
            "openrpg-${VERSION}.pkg"

      - name: Upload PKG to release
        uses: softprops/action-gh-release@v3
        with:
          files: openrpg-*.pkg

  # ── Windows: build NSIS installer ──────────────────────────────────────
  build-windows:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            flex
            bison
            make
            diffutils
            git
            unzip

      - name: Install SQLite ODBC driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.ch-werner.de/sqliteodbc/sqliteodbc_w64.exe" -OutFile "$env:TEMP\sqliteodbc_w64.exe" -SkipCertificateCheck
          Start-Process -Wait -FilePath "$env:TEMP\sqliteodbc_w64.exe" -ArgumentList "/S"
          # The installer registers as "SQLite3 ODBC Driver"; add alias "SQLite3" so
          # connection strings using Driver={SQLite3} work
          $driverKey = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3 ODBC Driver"
          $dllPath   = (Get-ItemProperty -Path $driverKey -Name Driver).Driver
          New-Item -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Driver -Value $dllPath -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Setup  -Value $dllPath -PropertyType String -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers" -Name SQLite3 -Value Installed

      - name: Build
        shell: msys2 {0}
        run: make && make -C OpenDSPF VERSION=${GITHUB_REF_NAME#v}

      - name: Run OpenRPG test suite
        shell: msys2 {0}
        env:
          CXX: g++
          ODBC_FLAGS: -lodbc32
        run: make test

      - name: Run OpenDSPF test suite
        shell: msys2 {0}
        run: make -C OpenDSPF test

      - name: Install NSIS
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "choco install nsis failed after 5 attempts" }
            Write-Host "choco install nsis failed (attempt $i/5), retrying in 30s..."
            Start-Sleep -Seconds 30
          }

      # Bundled compiler: end users shouldn't need MSYS2/MSVC/anything else
      # installed just to run rpgc. Pinned to a specific llvm-mingw release
      # so an upstream release can't silently change what we ship — see
      # scripts/stage-mingw.sh for what gets kept vs. trimmed (~724MB raw
      # release -> ~290MB). gh needs the outer Windows PATH, which the MSYS2
      # shell below doesn't inherit, so the download happens here in pwsh.
      - name: Download bundled compiler toolchain
        shell: pwsh
        run: gh release download 20260616 --repo mstorsjo/llvm-mingw --pattern "llvm-mingw-20260616-ucrt-x86_64.zip" -O llvm-mingw.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stage bundled compiler toolchain
        shell: msys2 {0}
        run: bash scripts/stage-mingw.sh llvm-mingw.zip x86_64 installer/mingw

      - name: Build and stage bundled PDCurses
        shell: msys2 {0}
        run: bash scripts/build-pdcurses.sh installer/mingw x86_64-w64-mingw32

      - name: Stage installer files
        shell: pwsh
        run: |
          Copy-Item rpgc.exe installer\ -ErrorAction Stop
          Copy-Item runtime\*.h installer\ -ErrorAction Stop
          Copy-Item OpenDSPF\dspfc.exe installer\ -ErrorAction Stop
          Copy-Item OpenDSPF\runtime\rpg_dspf_runtime.h installer\ -ErrorAction Stop

      - name: Build installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$VERSION installer\openrpg.nsi

      - name: Upload installer
        uses: softprops/action-gh-release@v3
        with:
          files: installer/openrpg-*-windows-x64.exe

  # ── Windows ARM64: build NSIS installer ──────────────────────────────────
  # No upstream ARM64 build of the SQLite ODBC driver exists, so the SQL/RLA
  # test suite is skipped here (see tests/run_tests.sh SKIP_SQL) rather than
  # installing a driver that doesn't exist for this platform.
  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            flex
            bison
            make
            diffutils
            git
            unzip

      - name: Build
        shell: msys2 {0}
        run: make && make -C OpenDSPF VERSION=${GITHUB_REF_NAME#v}

      - name: Run OpenRPG test suite
        shell: msys2 {0}
        env:
          SKIP_SQL: "1"
          ODBC_FLAGS: -lodbc32
        run: make test

      - name: Run OpenDSPF test suite
        shell: msys2 {0}
        run: make -C OpenDSPF test

      - name: Install NSIS
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "choco install nsis failed after 5 attempts" }
            Write-Host "choco install nsis failed (attempt $i/5), retrying in 30s..."
            Start-Sleep -Seconds 30
          }

      # Bundled compiler: see the equivalent step in build-windows above for
      # why this happens in pwsh (gh) followed by msys2 (unzip/find/make).
      - name: Download bundled compiler toolchain
        shell: pwsh
        run: gh release download 20260616 --repo mstorsjo/llvm-mingw --pattern "llvm-mingw-20260616-ucrt-aarch64.zip" -O llvm-mingw.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stage bundled compiler toolchain
        shell: msys2 {0}
        run: bash scripts/stage-mingw.sh llvm-mingw.zip aarch64 installer/mingw

      - name: Build and stage bundled PDCurses
        shell: msys2 {0}
        run: bash scripts/build-pdcurses.sh installer/mingw aarch64-w64-mingw32

      - name: Stage installer files
        shell: pwsh
        run: |
          Copy-Item rpgc.exe installer\ -ErrorAction Stop
          Copy-Item runtime\*.h installer\ -ErrorAction Stop
          Copy-Item OpenDSPF\dspfc.exe installer\ -ErrorAction Stop
          Copy-Item OpenDSPF\runtime\rpg_dspf_runtime.h installer\ -ErrorAction Stop

      - name: Build installer
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$VERSION installer\openrpg.nsi
          # The .nsi hardcodes "-windows-x64" in its OutFile; rename rather
          # than parameterize the shared script since the payload (rpgc.exe/
          # dspfc.exe) is the only thing that's actually arch-specific here.
          Rename-Item "installer\openrpg-$VERSION-windows-x64.exe" "openrpg-$VERSION-windows-arm64.exe"

      - name: Upload installer
        uses: softprops/action-gh-release@v3
        with:
          files: installer/openrpg-*-windows-arm64.exe
