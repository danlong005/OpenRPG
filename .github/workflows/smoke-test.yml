name: Smoke Test

# Runs after a release is published to verify the packaged binaries
# work correctly against the full test suite.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

# Only run if the release workflow succeeded
jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get release tag
        id: get-tag
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          # workflow_run head_branch is the tag name for tag-triggered runs
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  # ── macOS .pkg ───────────────────────────────────────────────────────────
  smoke-macos:
    name: macOS (.pkg)
    runs-on: macos-latest
    needs: check


    steps:
      - uses: actions/checkout@v6

      - name: Install ODBC dependencies
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install unixodbc sqliteodbc coreutils
          # Homebrew installs the sqliteodbc library but does NOT register it with
          # unixODBC.  Register it manually so Driver={SQLite3} works at runtime.
          DRIVER=$(brew --prefix)/lib/libsqlite3odbc.dylib
          printf '[SQLite3]\nDescription=SQLite3 ODBC Driver\nDriver=%s\nSetup=%s\n' \
            "$DRIVER" "$DRIVER" \
            | ODBCSYSINI=/opt/homebrew/etc odbcinst -i -d -f /dev/stdin

      - name: Download release package
        timeout-minutes: 5
        run: gh release download "${{ needs.check.outputs.tag }}" --pattern "openrpg-*.pkg"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package
        timeout-minutes: 5
        run: |
          xattr -cr openrpg-*.pkg
          sudo installer -pkg openrpg-*.pkg -target /

      - name: Run tests
        timeout-minutes: 20
        env:
          ODBCSYSINI: /opt/homebrew/etc
        run: |
          RPGC=rpgc \
          RUNTIME_DIR=/usr/local/share/rpgc/runtime \
          ODBC_FLAGS="-I/opt/homebrew/include -L/opt/homebrew/lib -lodbc" \
          bash tests/run_tests.sh

  # ── Linux .deb ───────────────────────────────────────────────────────────
  smoke-deb:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    needs: check


    steps:
      - uses: actions/checkout@v6

      - name: Install ODBC dependencies
        run: sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc

      - name: Download release package
        # Both x86_64 and arm64 packages exist in the same release now —
        # the pattern must pin the architecture or it grabs both.
        run: gh release download "${{ needs.check.outputs.tag }}" --pattern "rpgc_*_amd64.deb"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package
        run: sudo dpkg -i rpgc_*_amd64.deb

      - name: Run tests
        run: |
          RPGC=rpgc \
          RUNTIME_DIR=/usr/share/rpgc/runtime \
          ODBC_FLAGS="-lodbc" \
          bash tests/run_tests.sh

  # ── Linux .rpm ───────────────────────────────────────────────────────────
  smoke-rpm:
    name: Linux (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: check


    steps:
      - uses: actions/checkout@v6

      - name: Install ODBC dependencies
        run: |
          dnf install -y unixODBC unixODBC-devel sqliteodbc diffutils gh clang

      - name: Download release package
        # Both x86_64 and arm64 packages exist in the same release now —
        # the pattern must pin the architecture or it grabs both.
        run: gh release download "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" --pattern "rpgc-*.x86_64.rpm"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package
        run: dnf install -y ./rpgc-*.x86_64.rpm

      - name: Run tests
        run: |
          RPGC=rpgc \
          RUNTIME_DIR=/usr/share/rpgc/runtime \
          ODBC_FLAGS="-lodbc" \
          CXX=clang++ \
          bash tests/run_tests.sh

  # ── Windows .exe ─────────────────────────────────────────────────────────
  smoke-windows:
    name: Windows (.exe)
    runs-on: windows-2025
    needs: check

    # Deliberately no msys2/setup-msys2 step and no `defaults: shell: msys2`
    # here — this job exists to prove the installer works on a genuinely
    # bare Windows machine with nothing preinstalled, which is exactly what
    # earlier versions of this test did NOT do (it pre-installed a compiler
    # via MSYS2 and pointed rpgc at it, and installed to a space-free
    # C:\openrpg specifically to dodge a quoting bug rather than catch it —
    # neither reflects what an end user's machine looks like). Steps use
    # `shell: bash`, which resolves to Git Bash — present by default on
    # GitHub-hosted Windows runners, unlike MSYS2's isolated shell — so gh
    # and the installed rpgc.exe are both reachable without extra setup.

    steps:
      - uses: actions/checkout@v6

      - name: Install SQLite ODBC driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.ch-werner.de/sqliteodbc/sqliteodbc_w64.exe" -OutFile "$env:TEMP\sqliteodbc_w64.exe" -SkipCertificateCheck
          Start-Process -Wait -FilePath "$env:TEMP\sqliteodbc_w64.exe" -ArgumentList "/S"
          # The installer registers as "SQLite3 ODBC Driver"; add alias "SQLite3" so
          # connection strings using Driver={SQLite3} work
          $driverKey = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3 ODBC Driver"
          $dllPath   = (Get-ItemProperty -Path $driverKey -Name Driver).Driver
          New-Item -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Driver -Value $dllPath -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\SQLite3" -Name Setup  -Value $dllPath -PropertyType String -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers" -Name SQLite3 -Value Installed

      - name: Download release installer
        shell: pwsh
        run: gh release download "${{ needs.check.outputs.tag }}" --pattern "openrpg-*-windows-x64.exe"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install OpenRPG
        shell: pwsh
        run: |
          # No /D override — installs to the real default $PROGRAMFILES64\openrpg,
          # which contains a space. That's exactly the case that broke every
          # compile before rpgc quoted its compiler command line.
          $exe = Get-Item "openrpg-*-windows-x64.exe"
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList "/S"

      - name: Run tests
        shell: bash
        run: |
          export PATH="/c/Program Files/openrpg:$PATH"
          RPGC=rpgc \
          RUNTIME_DIR="/c/Program Files/openrpg/runtime" \
          ODBC_FLAGS="-lodbc32" \
          CXX="/c/Program Files/openrpg/mingw/bin/x86_64-w64-mingw32-clang++.exe" \
          bash tests/run_tests.sh

  # ── Linux ARM64 .deb ─────────────────────────────────────────────────────
  smoke-deb-arm64:
    name: Linux ARM64 (.deb)
    runs-on: ubuntu-24.04-arm
    needs: check

    steps:
      - uses: actions/checkout@v6

      - name: Install ODBC dependencies
        run: sudo apt-get install -y unixodbc unixodbc-dev libsqliteodbc

      - name: Download release package
        run: gh release download "${{ needs.check.outputs.tag }}" --pattern "rpgc_*_arm64.deb"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package
        run: sudo dpkg -i rpgc_*_arm64.deb

      - name: Run tests
        run: |
          RPGC=rpgc \
          RUNTIME_DIR=/usr/share/rpgc/runtime \
          ODBC_FLAGS="-lodbc" \
          bash tests/run_tests.sh

  # ── Linux ARM64 .rpm ─────────────────────────────────────────────────────
  smoke-rpm-arm64:
    name: Linux ARM64 (.rpm)
    runs-on: ubuntu-24.04-arm
    container: fedora:latest
    needs: check

    steps:
      - uses: actions/checkout@v6

      - name: Install ODBC dependencies
        run: |
          dnf install -y unixODBC unixODBC-devel sqliteodbc diffutils gh clang

      - name: Download release package
        run: gh release download "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" --pattern "rpgc-*.aarch64.rpm"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package
        run: dnf install -y ./rpgc-*.aarch64.rpm

      - name: Run tests
        run: |
          RPGC=rpgc \
          RUNTIME_DIR=/usr/share/rpgc/runtime \
          ODBC_FLAGS="-lodbc" \
          CXX=clang++ \
          bash tests/run_tests.sh

  # ── Windows ARM64 .exe ───────────────────────────────────────────────────
  # No upstream ARM64 SQLite ODBC driver exists, so SQL/RLA tests are
  # skipped here rather than failed — see tests/run_tests.sh SKIP_SQL.
  smoke-windows-arm64:
    name: Windows ARM64 (.exe)
    runs-on: windows-11-arm
    needs: check

    # See smoke-windows above for why there's no MSYS2 setup here — this is
    # exactly the class of machine (fresh Windows ARM64, nothing
    # preinstalled) where the DLL/tmp-path/wrong-compiler/quoting bugs were
    # actually found, none of which the old MSYS2-preinstalled version of
    # this job could have caught.

    steps:
      - uses: actions/checkout@v6

      - name: Download release installer
        shell: pwsh
        run: gh release download "${{ needs.check.outputs.tag }}" --pattern "openrpg-*-windows-arm64.exe"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install OpenRPG
        shell: pwsh
        run: |
          # No /D override — installs to the real default $PROGRAMFILES64\openrpg,
          # which contains a space.
          $exe = Get-Item "openrpg-*-windows-arm64.exe"
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList "/S"

      - name: Run tests
        shell: bash
        run: |
          export PATH="/c/Program Files/openrpg:$PATH"
          RPGC=rpgc \
          RUNTIME_DIR="/c/Program Files/openrpg/runtime" \
          SKIP_SQL=1 \
          CXX="/c/Program Files/openrpg/mingw/bin/aarch64-w64-mingw32-clang++.exe" \
          bash tests/run_tests.sh
